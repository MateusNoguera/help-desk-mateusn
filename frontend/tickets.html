<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk - Tickets</title>
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <header class="app-header">
        <div class="app-header-content">
            <a class="app-logo" href="/tickets.html">Help Desk</a>

            <nav class="app-nav">
                <a class="header-button active" href="/tickets.html">Tickets</a>
                <a id="usersButton" class="header-button" href="/users.html">Usuários</a>
                <a class="header-button" href="/account.html">Minha conta</a>
                <div class="language-switcher">
                    <button type="button" class="language-option active" data-language="pt-BR">PT</button>
                    <button type="button" class="language-option" data-language="en">EN</button>
                </div>
                <div class="theme-switcher">
                    <button type="button" class="theme-option" data-theme-value="light">Claro</button>
                    <button type="button" class="theme-option" data-theme-value="dark">Escuro</button>
                </div>
                <button id="logoutButton">Sair</button>
            </nav>
        </div>
    </header>
    
    <main class="tickets-page">

        <div class="page-header">
            <h1 data-i18n="ticketsTitle">Tickets</h1>
            <button type="button" id="toggleTicketFormButton" class="primary-button" data-i18n="createTicket"> Criar ticket </button>
        </div>

        <div class="create-ticket-section">
            <form id="ticketForm" class="ticket-form hidden">
                <input type="text" id="title" placeholder="Título" required>

                <textarea id="description" placeholder="Descrição" required></textarea>

                <select id="priority" required>
                    <option value="LOW">Baixa</option>
                    <option value="MEDIUM" selected>Média</option>
                    <option value="HIGH">Alta</option>
                    <option value="CRITICAL">Crítica</option>
                </select>

                <button type="submit" class="primary-button">Salvar ticket</button>
            </form>
        </div>

        <div class="ticket-filters">
            <div class="filters-header">
                <h2 data-i18n="filtersTitle">Filtros</h2>
            </div>

            <input type="text" id="searchFilter" placeholder="Buscar tickets..." data-i18n-placeholder="searchTickets">

            <div class="filters-row">
                <select id="statusFilter">
                    <option value="" data-i18n="allStatuses">Todos os status</option>
                    <option value="OPEN">OPEN</option>
                    <option value="IN_PROGRESS">IN_PROGRESS</option>
                    <option value="RESOLVED">RESOLVED</option>
                    <option value="CLOSED">CLOSED</option>
                </select>

                <select id="priorityFilter">
                    <option value="" data-i18n="allPriorities">Todas as prioridades</option>
                    <option value="LOW">LOW</option>
                    <option value="MEDIUM">MEDIUM</option>
                    <option value="HIGH">HIGH</option>
                    <option value="CRITICAL">CRITICAL</option>
                </select>

                <select id="assigneeFilter">
                    <option value="" data-i18n="allAssignees">Todos os responsáveis</option>
                    <option value="unassigned">Sem responsável</option>
                </select>

                <button id="clearFiltersButton" data-i18n="clearFilters">Limpar filtros</button>
            </div>
        </div>

        <div id="ticketsList"></div>
    </main>

    <script src="./js/theme.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/tickets.js"></script>
</body>
</html>
