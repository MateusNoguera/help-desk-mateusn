<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk - Tickets</title>
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <header class="app-header">
        <div class="app-header-content">
            <a class="app-logo" href="/tickets.html">Help Desk</a>

            <nav class="app-nav">
                <a class="header-button active" href="/tickets.html" data-i18n="navTickets">Tickets</a>
                <a id="usersButton" class="header-button" href="/users.html" data-i18n="navUsers">Usuários</a>
                <a class="header-button" href="/account.html" data-i18n="navAccount">Minha conta</a>
                <div class="language-switcher">
                    <button type="button" class="language-option active" data-language="pt-BR">PT</button>
                    <button type="button" class="language-option" data-language="en">EN</button>
                </div>
                <div class="theme-switcher">
                    <button type="button" class="theme-option" data-theme-value="light">
                        <span data-i18n="themeLight">Claro</span>
                    </button>

                    <button type="button" class="theme-option" data-theme-value="dark">
                        <span data-i18n="themeDark">Escuro</span>
                    </button>
                </div>
                <button id="logoutButton" data-i18n="logout">Sair</button>
            </nav>
        </div>
    </header>
    
    <main class="tickets-page">

        <div class="page-header">
            <h1 data-i18n="ticketsTitle">Tickets</h1>
            <button type="button" id="toggleTicketFormButton" class="primary-button" data-i18n="createTicket"> Criar ticket </button>
        </div>

        <div class="create-ticket-section">
            <form id="ticketForm" class="ticket-form hidden">
                <input type="text" id="title" placeholder="Título" data-i18n-placeholder="ticketTitlePlaceholder" required>

                <textarea id="description" placeholder="Descrição" data-i18n-placeholder="ticketDescriptionPlaceholder" required></textarea>

                <select id="priority" required>
                    <option value="LOW" data-i18n="priorityLow">Baixa</option>
                    <option value="MEDIUM" data-i18n="priorityMedium">Média</option>
                    <option value="HIGH" data-i18n="priorityHigh">Alta</option>
                    <option value="CRITICAL" data-i18n="priorityCritical">Crítica</option>
                </select>

                <button type="submit" class="primary-button" data-i18n="saveTicket">Salvar ticket</button>
            </form>
        </div>

        <div class="ticket-filters">
            <div class="filters-header">
                <h2 data-i18n="filtersTitle">Filtros</h2>
            </div>

            <input type="text" id="searchFilter" placeholder="Buscar tickets..." data-i18n-placeholder="searchTickets">

            <div class="filters-row">
                <select id="statusFilter">
                    <option value="" data-i18n="allStatuses">Todos os status</option>
                    <option value="OPEN" data-i18n="statusOpen">Aberto</option>
                    <option value="IN_PROGRESS" data-i18n="statusInProgress">Em andamento</option>
                    <option value="RESOLVED" data-i18n="statusResolved">Resolvido</option>
                    <option value="CLOSED" data-i18n="statusClosed">Fechado</option>
                </select>

                <select id="priorityFilter">
                    <option value="" data-i18n="allPriorities">Todas as prioridades</option>
                    <option value="LOW" data-i18n="priorityLow">Baixa</option>
                    <option value="MEDIUM" data-i18n="priorityMedium">Média</option>
                    <option value="HIGH" data-i18n="priorityHigh">Alta</option>
                    <option value="CRITICAL" data-i18n="priorityCritical">Crítica</option>
                </select>

                <select id="assigneeFilter">
                    <option value="" data-i18n="allAssignees">Todos os responsáveis</option>
                    <option value="unassigned" data-i18n="noAssignee">Sem responsável</option>
                </select>

                <button id="clearFiltersButton" data-i18n="clearFilters">Limpar filtros</button>
            </div>
        </div>

        <div id="ticketsList"></div>
    </main>

    <script src="./js/theme.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/tickets.js"></script>
</body>
</html>
