<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta - Help Desk</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header class="app-header">
        <div class="app-header-content">
            <a class="app-logo" href="/tickets.html">Help Desk</a>

            <nav class="app-nav">
                <a class="header-button" href="/tickets.html">Tickets</a>
                <a id="usersButton" class="header-button" href="/users.html">Usuários</a>
                <a class="header-button active" href="/account.html">Minha conta</a>
                <button id="themeButton">
                    <span id="themeIcon"></span>
                    <span id="themeText">Tema claro</span>
                </button>
                <button id="logoutButton">Sair</button>
            </nav>
        </div>
    </header>

    <main class="account-page">
        <div class="page-header">
            <h1>Minha conta</h1>
        </div>

        <div class="account-content">
            <section class="account-card">
                <h2>Dados da conta</h2>

                <div class="account-info">
                    <p><strong>Nome:</strong> <span id="accountName"></span></p>
                    <p><strong>Email:</strong> <span id="accountEmail"></span></p>
                    <p><strong>Role:</strong> <span id="accountRole"></span></p>
                </div>
            </section>

            <section class="account-card">
                <h2>Alterar nome</h2>

                <form id="nameForm">
                    <input type="text" id="newName" placeholder="Novo nome" required>
                    <button type="submit">Alterar nome</button>
                </form>

                <p id="nameMessage"></p>
            </section>

            <section class="account-card">
                <h2>Alterar senha</h2>

                <form id="passwordForm">
                    <input type="password" id="currentPassword" placeholder="Senha atual" required>
                    <input type="password" id="newPassword" placeholder="Nova senha" minlength="8" required>
                    <button type="submit">Alterar senha</button>
                </form>

                <p id="passwordMessage"></p>
            </section>
        </div>
    </main>

    <script src="./js/theme.js"></script>
    <script src="/js/account.js"></script>
</body>
</html>
