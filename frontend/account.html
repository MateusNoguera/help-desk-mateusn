<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha conta - Help Desk</title>

    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <main class="auth-container">
        <h1>Minha conta</h1>

        <section class="account-info">
            <p><strong>Nome:</strong> <span id="accountName"></span></p>
            <p><strong>Email:</strong> <span id="accountEmail"></span></p>
            <p><strong>Role:</strong> <span id="accountRole"></span></p>
        </section>

        <form id="nameForm">
            <input type="text" id="newName" placeholder="Novo nome" required>
            <button type="submit">Alterar nome</button>
        </form>

        <p id="nameMessage"></p>

        <form id="passwordForm">
            <input type="password" id="currentPassword" placeholder="Senha atual" required>
            <input type="password" id="newPassword" placeholder="Nova senha" minlength="8" required>
            <button type="submit">Alterar senha</button>
        </form>

        <p id="passwordMessage"></p>

        <a href="/tickets.html">Voltar para Tickets</a>
    </main>

    <script src="/js/account.js"></script>
</body>
</html>
