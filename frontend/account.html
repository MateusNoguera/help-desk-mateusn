<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta - Help Desk</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header class="app-header">
        <div class="app-header-content">
            <a class="app-logo" href="/tickets.html">Help Desk</a>

            <nav class="app-nav">
                <a class="header-button" href="/tickets.html" data-i18n="navTickets">Tickets</a>
                <a id="usersButton" class="header-button" href="/users.html" data-i18n="navUsers">Usuários</a>
                <a class="header-button active" href="/account.html" data-i18n="navAccount">Minha conta</a>

                <div class="language-switcher">
                    <button type="button" class="language-option active" data-language="pt-BR">PT</button>
                    <button type="button" class="language-option" data-language="en">EN</button>
                </div>

                <div class="theme-switcher">
                    <button type="button" class="theme-option" data-theme-value="light">
                        <span data-i18n="themeLight">Claro</span>
                    </button>

                    <button type="button" class="theme-option" data-theme-value="dark">
                        <span data-i18n="themeDark">Escuro</span>
                    </button>
                </div>

                <button id="logoutButton" data-i18n="logout">Sair</button>
            </nav>
        </div>
    </header>

    <main class="account-page">
        <div class="page-header">
            <h1 data-i18n="accountTitle">Minha conta</h1>
        </div>

        <div class="account-content">
            <section class="account-card">
                <h2 data-i18n="accountData">Dados da conta</h2>

                <div class="account-info">
                    <p><strong data-i18n="name">Nome</strong>: <span id="accountName"></span></p>
                    <p><strong data-i18n="email">E-mail</strong>: <span id="accountEmail"></span></p>
                    <p><strong data-i18n="role">Cargo</strong>: <span id="accountRole"></span></p>
                </div>
            </section>

            <section class="account-card">
                <h2 data-i18n="changeName">Alterar nome</h2>

                <form id="nameForm">
                    <input type="text" id="newName" placeholder="Novo nome" data-i18n-placeholder="newNamePlaceholder" required>
                    <button type="submit" data-i18n="changeName">Alterar nome</button>
                </form>

                <p id="nameMessage"></p>
            </section>

            <section class="account-card">
                <h2 data-i18n="changePassword">Alterar senha</h2>

                <form id="passwordForm">
                    <input type="password" id="currentPassword" placeholder="Senha atual" data-i18n-placeholder="currentPasswordPlaceholder" required>
                    <input type="password" id="newPassword" placeholder="Nova senha" data-i18n-placeholder="newPasswordPlaceholder" minlength="8" required>
                    <button type="submit" data-i18n="changePassword">Alterar senha</button>
                </form>

                <p id="passwordMessage"></p>
            </section>
        </div>
    </main>

    <script src="./js/theme.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/account.js"></script>
</body>
</html>
