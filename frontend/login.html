<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Desk - Login</title>
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>
    <div class="auth-preferences">
        <div class="language-switcher">
            <button type="button" class="language-option active" data-language="pt-BR">PT</button>
            <button type="button" class="language-option" data-language="en">EN</button>
        </div>

        <div class="theme-switcher">
            <button type="button" class="theme-option" data-theme-value="light">
                <span data-i18n="themeLight">Claro</span>
            </button>

            <button type="button" class="theme-option" data-theme-value="dark">
                <span data-i18n="themeDark">Escuro</span>
            </button>
        </div>
    </div>
    
    <main class="login-page">
        <div class="login-header">
            <h1>Help Desk</h1>
        </div>

        <form id="loginForm">
            <label for="email" data-i18n="email">E-mail</label>
            <input type="email" id="email" name="email" required>

            <label for="password" data-i18n="password">Senha</label>
            <input type="password" id="password" name="password" required>

            <button type="submit" data-i18n="login">Entrar</button>
        </form>

        <div class="login-footer">
            <span data-i18n="noAccount">Não possui uma conta?</span>
            <a href="/register.html" data-i18n="createAccount">Criar conta</a>
        </div>

        <p id="loginMessage"></p>
    </main>

    <script src="./js/theme.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
